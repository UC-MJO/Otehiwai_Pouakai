[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "otehiwai-pouakai"
version = "2026.1.0"
description = "End-to-end FLI/B&C astronomical image reduction, astrometric, and photometric calibration pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zachary Lane" },
]

dependencies = [
    # Using the PR #9 revision until it's upstreamed.
    "calibrimbore @ git+https://github.com/pattersonjack/calibrimbore.git@a5f77234e84197ca5ce5ecf78bcb8fa32da6fc6c",
    # Latest NumPy supported by pysynphot, matching calibrimbore.
    "numpy==1.24.4",
    "pandas>=1.3",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "astropy>=5.2",
    "astroquery>=0.4.11",
    "astroscrappy>=1.1",
    # 2.x changes PSF subtraction defaults and DAOStarFinder fluxes.
    "photutils>=1.9,<2",
    # 0.20 adds Python 3.11 wheels; 0.26 deprecates our morphology APIs.
    "scikit-image>=0.20,<0.26",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "tqdm>=4.60",
    # 1.4.0 supplies Python 3.11 wheels compatible with NumPy 1.24.4.
    "sep>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
]

[project.scripts]
otehiwai-pouakai = "otehiwai_pouakai.pipeline:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
